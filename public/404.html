<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Página não encontrada · Lance a Lance</title>
    <style>
      :root { color-scheme: light dark; --bg: #eff1f5; --fg: #11161f; --muted: #5b6472; --primary: #2f4fd4; }
      @media (prefers-color-scheme: dark) { :root { --bg: #11161f; --fg: #eff1f5; --muted: #98a2b3; --primary: #8aa1ff; } }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px;
        background: var(--bg); color: var(--fg); text-align: center;
        font-family: Figtree, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      h1 { margin: 0 0 8px; font-size: 1.5rem; letter-spacing: -0.02em; }
      p { margin: 0 0 24px; color: var(--muted); font-size: 0.95rem; max-width: 22rem; }
      a {
        display: inline-block; padding: 12px 20px; border-radius: 12px;
        background: var(--primary); color: #fff; text-decoration: none; font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Página não encontrada</h1>
      <p>Este endereço não existe no Lance a Lance.</p>
      <a href="/">Ir para o início</a>
    </main>
  </body>
</html>
